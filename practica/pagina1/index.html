<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" href="./assets/favicon/steam_favicon.png" type="image/x-icon">
    <meta name="description" content="Steam es una plataforma de distribución digital de videojuegos desarrollada por Valve Corporation. Ofrece una amplia variedad de juegos, desde títulos independientes hasta grandes producciones, y proporciona servicios como actualizaciones automáticas, almacenamiento en la nube y comunidad en línea para los jugadores.">
    <title>Steam</title>
</head>
<body>
    <header>
        <div class="contenedor-header">
            <div class="brand">
                <img src="./assets/img/steam-header.png" alt="Logo de Steam" class="logo">
                <h1>Steam</h1>    
            </div>
            <div class="nav-links">
                <a href="./index.html">Home</a>
                <a href="./pages/servicios.html">Servicios</a>
                <a href="./pages/equipo.html">Sobre Nosostros</a>
                <a href="./pages/pedido.html">Pedido de Servicio</a>
                <a href="./pages/contacto.html">Contacto</a>
            </div>
        </div>
    </header>

    <main>
        <div class="contenedor-main">
            <h2>BIENVENIDO A STEAM</h2>
            <div class="secciones-steam">
                <section class="tienda-destacados">
                    <h3>DESTACADOS DE LA TIENDA</h3>
                    <div class="juegos">
                        <img src="./assets/img/cyberpunk2077.png" alt="Cyberpunk 2077" class="juego">
                        <img src="./assets/img/eldenring.png" alt="Elden Ring" class="juego">
                        <img src="./assets/img/gta5.png" alt="GTA V" class="juego">
                        <img src="./assets/img/rdd2.png" alt="Red Dead Redemption 2" class="juego">
                        <img src="./assets/img/re4.png" alt="Resident Evil 4 Remake" class="juego">
                        <img src="./assets/img/hn-silksong.png" alt="Hollow knight Silksong" class="juego">
                    </div>
                    <div class="botones-ofertas">
                        <button>VER OFERTAS</button>
                        <button>VER OFERTAS</button>
                    </div>
                </section>
                <section class="noticias-hardware">
                    <div class="noticias-cmnty">
                        <h3>NOTICIAS DE LA COMUNIDAD</h3>
                        <div class="noticias">
                            <div class="noticia">
                                <img src="./assets/img/msg.png" alt="msg icon" class="foro-icon">
                                <p>Nuevos Foros</p>
                            </div>
                            <div class="noticia">
                                <img src="./assets/img/calendar.png" alt="calendar icon" class="evento-icon">
                                <p>Actualizaciones de eventos</p>
                            </div>                            
                        </div>
                    </div>
                    <div class="hardware">
                        <h3>NUEVO HARDWARE</h3>
                        <img src="./assets/img/steam-deck.png" alt="Steam Deck" class="hardware-img">                        
                    </div>
                </section>
            </div>
        </div>
